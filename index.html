
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102f32">
<meta name="description" content="Atlantic Rebook surf lesson cancellation and rebooking demo for Atlantic Edge Surf School, Lahinch.">
<title>Atlantic Rebook — Surf School Operations</title>
<style>
:root {
  --deep: #102f32;
  --deep2: #1a4142;
  --sea: #b9d8cf;
  --foam: #e9eee5;
  --sand: #f1e7d3;
  --paper: #faf7ef;
  --orange: #f0784b;
  --ink: #183536;
  --muted: #687a73;
  --line: #d4dcd3;
  --white: #fffdf7;
  --red: #a93632;
  --redbg: #fae7e2;
  --green: #28664c;
  --greenbg: #e4f0e6;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--paper);
  font-family: "Trebuchet MS", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.55;
}
button, select { font: inherit; }
button:focus-visible, select:focus-visible, a:focus-visible {
  outline: 3px solid var(--orange);
  outline-offset: 3px;
}
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: not-allowed; }
a { color: inherit; }
.topline { height: 5px; background: var(--orange); }
header {
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.wrap { width: min(1120px, calc(100% - 32px)); margin: auto; }
.header-inner {
  min-height: 78px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
}
.brand {
  display: flex; align-items: center; gap: 11px;
  text-decoration: none; color: var(--deep);
}
.brand-mark {
  width: 42px; height: 42px; display: grid; place-items: center;
  border-radius: 50% 50% 8px 50%;
  background: var(--deep); color: var(--sea); font-size: 25px;
}
.brand-name {
  font-size: 19px; font-weight: 900; letter-spacing: -1px;
  line-height: 1.15;
}
.brand-sub {
  display: block; margin-top: 4px; font-size: 10px;
  color: var(--muted); font-weight: 800; letter-spacing: 1.3px;
  text-transform: uppercase;
}
.sample-tag {
  padding: 6px 9px; background: var(--sand); color: var(--deep);
  border: 1px solid #d9c9aa; border-radius: 3px;
  font-size: 10px; font-weight: 900; letter-spacing: 1px;
  white-space: nowrap;
}
.intro-band {
  background: var(--deep); color: var(--paper); padding: 24px 0 21px;
}
.intro-top {
  display: flex; justify-content: space-between;
  gap: 16px; align-items: flex-start;
}
.eyebrow {
  color: var(--sea); font-size: 10px; font-weight: 900;
  letter-spacing: 2px; text-transform: uppercase;
}
h1 {
  margin: 7px 0 6px; font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(30px, 6vw, 45px); font-weight: 500;
  letter-spacing: -1.5px; line-height: 1.12;
}
.intro-copy { color: #c7d8ce; font-size: 13px; margin: 0; }
.today-date {
  padding: 9px 11px; border: 1px solid #ffffff40;
  color: var(--sea); font-size: 11px; font-weight: 800;
  text-align: right; white-space: nowrap;
}
.main-wrap { padding-top: 20px; padding-bottom: 112px; }
.nav {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 6px; padding: 6px; margin-bottom: 23px;
  background: #ece9df; border: 1px solid var(--line);
  border-radius: 5px;
}
.nav-btn {
  min-height: 57px; border: 0; border-radius: 3px;
  color: var(--muted); background: transparent;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 1px; font-weight: 900; font-size: 11px;
  letter-spacing: .8px;
}
.nav-btn .nav-icon { font-size: 19px; line-height: 1.3; }
.nav-btn.active {
  color: var(--paper); background: var(--deep);
}
.nav-count {
  display: inline-block; margin-left: 3px; color: var(--orange);
}
.view-heading {
  display: flex; justify-content: space-between;
  align-items: flex-start; gap: 15px; margin-bottom: 18px;
}
.view-kicker {
  color: var(--muted); font-size: 10px; font-weight: 900;
  letter-spacing: 1.7px; text-transform: uppercase;
}
h2 {
  margin: 5px 0 5px; color: var(--deep);
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(30px, 6vw, 39px); font-weight: 500;
  letter-spacing: -1.3px; line-height: 1.12;
}
.view-subtitle { color: var(--muted); font-size: 13px; }
.small-label {
  color: var(--muted); font-size: 10px; font-weight: 900;
  letter-spacing: 1.3px; text-transform: uppercase;
}
.stats {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px; margin-bottom: 25px;
}
.stat {
  padding: 14px; background: var(--white);
  border: 1px solid var(--line); border-top: 3px solid var(--sea);
  min-width: 0;
}
.stat-label { color: var(--muted); font-size: 11px; font-weight: 800; }
.stat-value {
  margin-top: 5px; color: var(--deep);
  font-size: clamp(25px, 5vw, 32px); font-weight: 900;
  letter-spacing: -1.2px; line-height: 1.15;
  overflow-wrap: anywhere;
}
.stat-note { margin-top: 4px; color: var(--muted); font-size: 11px; }
.section-divider {
  display: flex; justify-content: space-between; gap: 10px;
  align-items: center; margin: 26px 0 12px;
  padding-bottom: 9px; border-bottom: 1px solid #c6d0c6;
}
.section-divider span:first-child {
  color: var(--deep); font-size: 11px;
  font-weight: 900; letter-spacing: 1.2px; text-transform: uppercase;
}
.section-divider span:last-child { color: var(--muted); font-size: 11px; }
.session-list, .booking-list { display: grid; gap: 12px; }
.card {
  min-width: 0; background: var(--white);
  border: 1px solid var(--line); padding: 16px;
}
.card-head {
  display: flex; justify-content: space-between;
  align-items: flex-start; gap: 10px;
}
.session-time {
  color: var(--deep); font-family: Georgia, "Times New Roman", serif;
  font-size: 30px; font-weight: 500; letter-spacing: -1px; line-height: 1.1;
}
.session-date { margin-top: 5px; color: var(--muted); font-size: 12px; }
.pill {
  display: inline-block; padding: 5px 7px; border-radius: 2px;
  background: var(--foam); color: var(--deep);
  font-size: 10px; font-weight: 900; white-space: nowrap;
}
.pill.red { background: var(--redbg); color: var(--red); }
.pill.green { background: var(--greenbg); color: var(--green); }
.pill.cancelled { background: var(--redbg); color: var(--red); }
.card.is-cancelled {
  border-color: #d8b9af;
  background: #fff9f6;
}
.card.is-cancelled .capacity-fill { background: #b9c4bd; }
.meta {
  margin-top: 12px; color: var(--muted); font-size: 12px;
}
.meta strong { color: var(--ink); }
.capacity-track {
  height: 7px; margin-top: 14px; overflow: hidden;
  background: #e8e8dc;
}
.capacity-fill { height: 100%; background: #6b9b87; }
.capacity-fill.full { background: var(--orange); }
.capacity-caption {
  display: flex; justify-content: space-between; gap: 8px;
  margin-top: 6px; color: var(--muted); font-size: 10px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; min-height: 49px; padding: 11px 14px;
  border: 1px solid transparent; border-radius: 3px;
  font-size: 12px; font-weight: 900; text-align: center;
  letter-spacing: .4px;
}
.btn-block { width: 100%; margin-top: 15px; min-height: 53px; }
.btn-danger { background: var(--orange); color: #2b211b; }
.btn-danger:hover { background: #ff956e; }
.btn-primary { background: var(--deep); color: var(--white); }
.btn-primary:hover { background: var(--deep2); }
.btn-secondary { background: var(--foam); color: var(--deep); border-color: var(--line); }
.btn-reset { background: transparent; color: var(--red); border-color: #d8b9af; }
.booking-card.overdue {
  border: 2px solid #c75c4b; background: #fff8f4;
}
.overdue-banner {
  margin-top: 12px; padding: 9px 10px;
  background: var(--redbg); color: var(--red);
  font-size: 11px; font-weight: 900;
}
.booking-name {
  margin: 0; font-size: 17px; font-weight: 900;
  letter-spacing: -.3px; overflow-wrap: anywhere;
}
.booking-size { color: var(--muted); font-size: 12px; margin-top: 4px; }
.booking-info {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 13px 9px; margin-top: 17px;
}
.info-label {
  color: var(--muted); font-size: 9px; font-weight: 900;
  letter-spacing: 1px; text-transform: uppercase;
}
.info-value { margin-top: 3px; font-size: 12px; overflow-wrap: anywhere; }
.picker { margin-top: 16px; }
.picker label {
  display: block; margin-bottom: 7px;
  color: var(--deep); font-size: 11px; font-weight: 900;
}
select {
  width: 100%; min-height: 49px; padding: 9px;
  border: 1px solid #bdccc2; border-radius: 3px;
  color: var(--ink); background: var(--white); font-size: 12px;
}
.booking-footnote { margin: 11px 0 0; color: var(--muted); font-size: 11px; }
.empty {
  padding: 35px 18px; text-align: center;
  border: 1px dashed #b9c9bd; background: var(--white);
}
.empty-symbol { color: #719587; font-size: 32px; }
.empty h3 {
  margin: 9px 0 5px; color: var(--deep);
  font-family: Georgia, "Times New Roman", serif; font-size: 24px; font-weight: 500;
}
.empty p { margin: 0; color: var(--muted); font-size: 13px; }
.money-hero {
  position: relative; overflow: hidden; padding: 23px;
  background: var(--deep); color: var(--paper);
}
.money-hero::after {
  content: "€"; position: absolute; right: 12px; bottom: -55px;
  color: #ffffff0b; font-family: Georgia, serif; font-size: 190px;
  pointer-events: none;
}
.money-hero .small-label { color: var(--sea); }
.money-amount {
  position: relative; z-index: 1; margin: 10px 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(45px, 10vw, 70px); letter-spacing: -3px; line-height: 1.1;
}
.money-description { position: relative; z-index: 1; color: #c7d8ce; font-size: 12px; }
.money-rows { display: grid; gap: 8px; margin-top: 12px; }
.money-row {
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; padding: 16px; background: var(--white);
  border: 1px solid var(--line);
}
.money-row span { color: var(--muted); font-size: 12px; }
.money-row strong { color: var(--deep); font-size: 17px; text-align: right; }
.notice {
  margin-top: 14px; padding: 14px; background: var(--sand);
  border: 1px solid #dfd1b8; color: #5e523a; font-size: 12px;
}
.actions { display: grid; gap: 9px; margin-top: 24px; }
.footnote { margin-top: 12px; color: var(--muted); font-size: 11px; }
footer {
  padding: 23px 0; background: var(--deep); color: #c7d8ce;
}
.footer-inner {
  display: flex; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; align-items: center;
}
footer p { margin: 0; font-size: 11px; }
footer a { color: var(--sea); font-size: 11px; font-weight: 800; }
.toast {
  position: fixed; z-index: 20; left: 16px; right: 16px;
  bottom: 100px; width: fit-content; max-width: calc(100% - 32px);
  margin: auto; padding: 14px 17px;
  background: var(--deep); color: var(--white);
  border-left: 4px solid var(--orange); box-shadow: 0 6px 25px #102f3230;
  font-size: 12px; font-weight: 800;
}
[hidden] { display: none !important; }
@media (min-width: 600px) {
  .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .session-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .booking-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .actions { grid-template-columns: 1fr 1fr; }
}
@media (min-width: 850px) {
  .main-wrap { padding-top: 30px; }
  .intro-band { padding: 30px 0; }
  .session-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .booking-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card { padding: 19px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div class="topline"></div>

<header>
  <div class="wrap header-inner">
    <a class="brand" href="#main" aria-label="Atlantic Rebook home">
      <span class="brand-mark" aria-hidden="true">≋</span>
      <span>
        <span class="brand-name">ATLANTIC REBOOK</span>
        <span class="brand-sub">Surf school operations</span>
      </span>
    </a>
    <span class="sample-tag">SAMPLE DATA</span>
  </div>
</header>

<div class="intro-band">
  <div class="wrap intro-top">
    <div>
      <div class="eyebrow">Atlantic Edge · Lahinch, Ireland</div>
      <h1>Keep the session alive.</h1>
      <p class="intro-copy">Cancelled lessons, organised. Rebooking, made clearer.</p>
    </div>
    <div class="today-date" id="today-date"></div>
  </div>
</div>

<main class="wrap main-wrap" id="main">
  <nav class="nav" aria-label="Main navigation">
    <button class="nav-btn active" data-view="today" aria-current="page">
      <span class="nav-icon" aria-hidden="true">☀</span>
      TODAY
    </button>
    <button class="nav-btn" data-view="rebook">
      <span class="nav-icon" aria-hidden="true">↗</span>
      REBOOK <span class="nav-count" id="nav-count"></span>
    </button>
    <button class="nav-btn" data-view="money">
      <span class="nav-icon" aria-hidden="true">€</span>
      MONEY
    </button>
  </nav>

  <div id="app"></div>
</main>

<footer>
  <div class="wrap footer-inner">
    <p>ATLANTIC REBOOK · SAMPLE DATA · STUDENT PROJECT</p>
    <a href="https://laurencp2026.github.io/" target="_blank" rel="noopener noreferrer">PROJECT HOME ↗</a>
  </div>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
"use strict";

(() => {
  const STORAGE_KEY = "atlanticRebook.sampleData.v2";
  const CAPACITY = 12;
  const PRICE = 45;
  const OVERDUE_MS = 48 * 60 * 60 * 1000;

  const app = document.getElementById("app");
  const toastElement = document.getElementById("toast");

  let state;
  let view = "today";
  let toastTimer;

  const pad = n => String(n).padStart(2, "0");

  function dateKey(date) {
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
  }

  function dayKey(offset = 0) {
    const date = new Date();
    date.setHours(0, 0, 0, 0);
    date.setDate(date.getDate() + offset);
    return dateKey(date);
  }

  function dateTimeISO(offset, hour, minute) {
    const date = new Date();
    date.setHours(0, 0, 0, 0);
    date.setDate(date.getDate() + offset);
    date.setHours(hour, minute, 0, 0);
    return date.toISOString();
  }

  function makeInitialState() {
    const today = dayKey();
    const sessions = [
      ["TODAY-1", today, 9, 0, "Aoife Murphy"],
      ["TODAY-2", today, 10, 30, "Cian O'Brien"],
      ["TODAY-3", today, 12, 0, "Niamh Kelly"],
      ["TODAY-4", today, 13, 30, "Finn Walsh"],
      ["TODAY-5", today, 15, 0, "Aoife Murphy"],
      ["TODAY-6", today, 16, 30, "Cian O'Brien"],
      ["FUTURE-1", dayKey(1), 9, 30, "Niamh Kelly"],
      ["FUTURE-2", dayKey(1), 13, 0, "Finn Walsh"],
      ["FUTURE-3", dayKey(2), 10, 0, "Aoife Murphy"]
    ].map(([id, date, hour, minute, instructor]) => ({
      id, date, hour, minute, instructor, capacity: CAPACITY, cancelled: false
    }));

    // Fictional sample records only. No real customer information.
    const bookings = [
      {
        id: "B001", name: "SAMPLE: Jamie Byrne", groupSize: 2,
        contact: "sample.jamie@example.com", phone: "SAMPLE: 080 000 0001",
        sessionId: "TODAY-1", status: "booked",
        cancelledAt: null, originalSession: null
      },
      {
        id: "B002", name: "SAMPLE: Casey Nolan", groupSize: 3,
        contact: "sample.casey@example.com", phone: "SAMPLE: 080 000 0002",
        sessionId: "TODAY-1", status: "booked",
        cancelledAt: null, originalSession: null
      },
      {
        id: "B003", name: "SAMPLE: Morgan Hayes", groupSize: 2,
        contact: "sample.morgan@example.com", phone: "SAMPLE: 080 000 0003",
        sessionId: "TODAY-2", status: "booked",
        cancelledAt: null, originalSession: null
      },
      {
        id: "B004", name: "SAMPLE: Riley Quinn", groupSize: 4,
        contact: "sample.riley@example.com", phone: "SAMPLE: 080 000 0004",
        sessionId: "TODAY-3", status: "booked",
        cancelledAt: null, originalSession: null
      },
      {
        id: "B005", name: "SAMPLE: Alex Duffy", groupSize: 2,
        contact: "sample.alex@example.com", phone: "SAMPLE: 080 000 0005",
        sessionId: "TODAY-4", status: "booked",
        cancelledAt: null, originalSession: null
      },
      {
        id: "B006", name: "SAMPLE: Taylor Flynn", groupSize: 3,
        contact: "sample.taylor@example.com", phone: "SAMPLE: 080 000 0006",
        sessionId: "FUTURE-1", status: "booked",
        cancelledAt: null, originalSession: null
      },
      {
        id: "B007", name: "SAMPLE: Jordan Casey", groupSize: 2,
        contact: "sample.jordan@example.com", phone: "SAMPLE: 080 000 0007",
        sessionId: "FUTURE-2", status: "booked",
        cancelledAt: null, originalSession: null
      },
      {
        id: "B008", name: "SAMPLE: Sam Keane", groupSize: 3,
        contact: "sample.sam@example.com", phone: "SAMPLE: 080 000 0008",
        sessionId: null, status: "pending",
        cancelledAt: new Date(Date.now() - 50 * 60 * 60 * 1000).toISOString(),
        originalSession: "Sample session · 10:30"
      },
      {
        id: "B009", name: "SAMPLE: Drew Lynch", groupSize: 2,
        contact: "sample.drew@example.com", phone: "SAMPLE: 080 000 0009",
        sessionId: null, status: "pending",
        cancelledAt: new Date(Date.now() - 6 * 60 * 60 * 1000).toISOString(),
        originalSession: "Sample session · 12:00"
      }
    ];

    return { version: 2, sessions, bookings };
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (error) {
      console.error("Saving failed:", error);
      toast("Browser storage is unavailable. Changes may not persist.");
    }
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (
          parsed &&
          parsed.version === 2 &&
          Array.isArray(parsed.sessions) &&
          Array.isArray(parsed.bookings)
        ) return parsed;
      }
    } catch (error) {
      console.warn("Could not load saved data:", error);
    }

    const initial = makeInitialState();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
    } catch (error) {
      console.warn("Could not initialise browser storage:", error);
    }
    return initial;
  }

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;",
      '"': "&quot;", "'": "&#39;"
    })[c]);
  }

  function euro(value) {
    return new Intl.NumberFormat("en-IE", {
      style: "currency", currency: "EUR", maximumFractionDigits: 0
    }).format(value);
  }

  function formatDate(dateString, short = false) {
    const [y, m, d] = dateString.split("-").map(Number);
    return new Intl.DateTimeFormat("en-IE", {
      weekday: short ? "short" : "long",
      day: "numeric", month: "short",
      ...(short ? {} : { year: "numeric" })
    }).format(new Date(y, m - 1, d, 12));
  }

  function time(session) {
    return `${pad(session.hour)}:${pad(session.minute)}`;
  }

  function sessionLabel(session) {
    return `${formatDate(session.date, true)} · ${time(session)}`;
  }

  function getSession(id) {
    return state.sessions.find(s => s.id === id) || null;
  }

  function bookedGroups(sessionId) {
    return state.bookings.filter(b =>
      b.status === "booked" && b.sessionId === sessionId
    );
  }

  function bookedPeople(sessionId) {
    return bookedGroups(sessionId).reduce((sum, b) => sum + b.groupSize, 0);
  }

  function placesLeft(session) {
    return Math.max(0, session.capacity - bookedPeople(session.id));
  }

  function pending() {
    return state.bookings.filter(b => b.status === "pending");
  }

  function pendingPeople() {
    return pending().reduce((sum, b) => sum + b.groupSize, 0);
  }

  function overdue(booking, now = Date.now()) {
    const timestamp = Date.parse(booking.cancelledAt);
    return booking.status === "pending" &&
      Number.isFinite(timestamp) && now - timestamp >= OVERDUE_MS;
  }

  function availableSessions(booking) {
    const now = new Date();
    return state.sessions
      .filter(session => {
        if (session.cancelled || session.date < dayKey()) return false;

        const starts = new Date(
          `${session.date}T${pad(session.hour)}:${pad(session.minute)}:00`
        );

        return starts > now && placesLeft(session) >= booking.groupSize;
      })
      .sort((a, b) =>
        a.date.localeCompare(b.date) ||
        a.hour - b.hour || a.minute - b.minute
      )
      .slice(0, 3);
  }

  function toast(message) {
    toastElement.textContent = message;
    toastElement.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastElement.hidden = true; }, 3500);
  }

  function renderHeader() {
    document.getElementById("today-date").textContent =
      new Intl.DateTimeFormat("en-IE", {
        weekday: "short", day: "numeric", month: "short", year: "numeric"
      }).format(new Date());
  }

  function renderNav() {
    document.querySelectorAll("[data-view]").forEach(button => {
      const active = button.dataset.view === view;
      button.classList.toggle("active", active);
      if (active) button.setAttribute("aria-current", "page");
      else button.removeAttribute("aria-current");
    });
    const count = pending().length;
    document.getElementById("nav-count").textContent = count ? `(${count})` : "";
  }

  function renderStats(items) {
    return `<div class="stats">${items.map(item => `
      <div class="stat">
        <div class="stat-label">${item.label}</div>
        <div class="stat-value">${item.value}</div>
        <div class="stat-note">${item.note}</div>
      </div>
    `).join("")}</div>`;
  }

  function sessionCard(session) {
    const groups = bookedGroups(session.id);
    const people = bookedPeople(session.id);
    const left = placesLeft(session);
    const percent = Math.min(100, people / session.capacity * 100);

    return `
      <article class="card session-card ${session.cancelled ? "is-cancelled" : ""}">
        <div class="card-head">
          <div>
            <div class="session-time">${time(session)}</div>
            <div class="session-date">${escapeHTML(formatDate(session.date))}</div>
          </div>
          ${session.cancelled
            ? `<span class="pill cancelled" role="status">CANCELLED</span>`
            : `<span class="pill ${left === 0 ? "red" : ""}">${left} free</span>`
          }
        </div>
        <div class="meta"><strong>Instructor</strong> · ${escapeHTML(session.instructor)}</div>
        <div class="meta">
          <strong>${groups.length}</strong> booking groups ·
          <strong>${people}/${session.capacity}</strong> people
        </div>
        <div class="capacity-track" role="progressbar"
          aria-label="People booked" aria-valuemin="0"
          aria-valuemax="${session.capacity}" aria-valuenow="${people}">
          <div class="capacity-fill ${left === 0 ? "full" : ""}"
            style="width:${percent}%"></div>
        </div>
        <div class="capacity-caption">
          <span>${people} booked</span><span>Capacity ${session.capacity}</span>
        </div>
        ${session.cancelled
          ? `<div class="pill cancelled" role="status" style="display:block; text-align:center; margin-top:15px; padding:11px;">
               SESSION CANCELLED · REBOOKING QUEUE UPDATED
             </div>`
          : `<button class="btn btn-danger btn-block" data-cancel="${escapeHTML(session.id)}">
               CANCEL SESSION ↘
             </button>`
        }
      </article>`;
  }

  function renderToday() {
    const sessions = state.sessions.filter(s => s.date === dayKey())
      .sort((a, b) => a.hour - b.hour || a.minute - b.minute);
    const groups = sessions.reduce((sum, s) => sum + bookedGroups(s.id).length, 0);
    const people = sessions.reduce((sum, s) => sum + bookedPeople(s.id), 0);

    app.innerHTML = `
      <div class="view-heading">
        <div>
          <div class="view-kicker">01 / Daily operations</div>
          <h2>Today's sessions.</h2>
          <div class="view-subtitle">Six sessions. Twelve places each. Keep the picture clear.</div>
        </div>
      </div>
      ${renderStats([
        {label:"Sessions", value:sessions.length, note:"Scheduled today"},
        {label:"Booking groups", value:groups, note:"Today's groups"},
        {label:"People booked", value:people, note:"Places occupied"},
        {label:"Awaiting rebook", value:pending().length, note:"Groups outstanding"}
      ])}
      <div class="section-divider">
        <span>Today's surf report</span>
        <span>Capacity: 12 / session</span>
      </div>
      <div class="session-list">
        ${sessions.length ? sessions.map(sessionCard).join("") : `
          <div class="empty">
            <div class="empty-symbol">≋</div>
            <h3>No sessions today</h3>
            <p>There are no sessions scheduled for today's date.</p>
          </div>`}
      </div>
      <div class="actions">
        <button class="btn btn-secondary" data-reset>↻ RESET SAMPLE DATA</button>
        <button class="btn btn-primary" data-go="rebook">VIEW REBOOK LIST ↗</button>
      </div>
      <p class="footnote">All customer records are fictional sample data. Cancelled sessions are marked and cannot be cancelled again. Cancelling a session requires confirmation.</p>
    `;
  }

  function bookingCard(booking) {
    const options = availableSessions(booking);
    const isLate = overdue(booking);
    const cancelled = new Date(booking.cancelledAt);
    const cancelledLabel = Number.isNaN(cancelled.getTime()) ? "Unknown" :
      new Intl.DateTimeFormat("en-IE", {
        day: "numeric", month: "short",
        hour: "2-digit", minute: "2-digit"
      }).format(cancelled);

    const optionsHTML = options.map(session => `
      <option value="${escapeHTML(session.id)}">
        ${escapeHTML(sessionLabel(session))} · ${placesLeft(session)} places free
      </option>
    `).join("");

    return `
      <article class="card booking-card ${isLate ? "overdue" : ""}">
        <div class="card-head">
          <div>
            <h3 class="booking-name">${escapeHTML(booking.name)}</h3>
            <div class="booking-size">
              SAMPLE GROUP · ${booking.groupSize}
              ${booking.groupSize === 1 ? "PERSON" : "PEOPLE"}
            </div>
          </div>
          <span class="pill ${isLate ? "red" : ""}">
            ${isLate ? "OVER 48 HOURS" : "TO REBOOK"}
          </span>
        </div>
        ${isLate ? `
          <div class="overdue-banner">
            ⚠ REBOOKING OVERDUE · Cancelled more than 48 hours ago.
          </div>` : ""}
        <div class="booking-info">
          <div>
            <div class="info-label">Email</div>
            <div class="info-value">${escapeHTML(booking.contact)}</div>
          </div>
          <div>
            <div class="info-label">Phone</div>
            <div class="info-value">${escapeHTML(booking.phone)}</div>
          </div>
          <div>
            <div class="info-label">Original session</div>
            <div class="info-value">${escapeHTML(booking.originalSession || "Not recorded")}</div>
          </div>
          <div>
            <div class="info-label">Cancelled at</div>
            <div class="info-value">${escapeHTML(cancelledLabel)}</div>
          </div>
        </div>
        <div class="picker">
          <label for="pick-${escapeHTML(booking.id)}">SELECT A NEW SESSION</label>
          <select id="pick-${escapeHTML(booking.id)}"
            data-picker="${escapeHTML(booking.id)}" ${options.length ? "" : "disabled"}>
            ${options.length ? optionsHTML :
              `<option value="">No suitable session available</option>`}
          </select>
        </div>
        <button class="btn btn-primary btn-block"
          data-rebook="${escapeHTML(booking.id)}" ${options.length ? "" : "disabled"}>
          REBOOK ${booking.groupSize} ${booking.groupSize === 1 ? "PERSON" : "PEOPLE"} ↗
        </button>
        ${options.length ? "" : `
          <p class="booking-footnote">
            No upcoming session has enough free places for this entire group.
            Partial rebooking is not allowed.
          </p>`}
      </article>`;
  }

  function renderRebook() {
    const bookings = pending().sort((a, b) =>
      Date.parse(a.cancelledAt) - Date.parse(b.cancelledAt)
    );
    const people = pendingPeople();
    const late = bookings.filter(b => overdue(b)).length;

    app.innerHTML = `
      <div class="view-heading">
        <div>
          <div class="view-kicker">02 / Customer recovery</div>
          <h2>Back in the water.</h2>
          <div class="view-subtitle">Match each group to a future session with enough space.</div>
        </div>
      </div>
      ${renderStats([
        {label:"Waiting groups", value:bookings.length, note:"Bookings to resolve"},
        {label:"People waiting", value:people, note:"Places needed"},
        {label:"Overdue groups", value:late, note:"48-hour rule"},
        {label:"Money at risk", value:euro(people * PRICE), note:"€45 per person"}
      ])}
      <div class="section-divider">
        <span>Rebook queue</span>
        <span>${bookings.length} groups</span>
      </div>
      <div class="booking-list">
        ${bookings.length ? bookings.map(bookingCard).join("") : `
          <div class="empty">
            <div class="empty-symbol">≋</div>
            <h3>Queue clear.</h3>
            <p>There are no bookings waiting to be rebooked.</p>
          </div>`}
      </div>
      <div class="actions">
        <button class="btn btn-secondary" data-reset>↻ RESET SAMPLE DATA</button>
        <button class="btn btn-primary" data-go="money">VIEW MONEY AT RISK ↗</button>
      </div>
      <p class="footnote">The list updates after every cancellation or successful rebooking.</p>
    `;
  }

  function renderMoney() {
    const bookings = pending();
    const people = pendingPeople();
    const late = bookings.filter(b => overdue(b)).length;
    const booked = state.bookings.filter(b => b.status === "booked");
    const bookedCount = booked.reduce((sum, b) => sum + b.groupSize, 0);

    app.innerHTML = `
      <div class="view-heading">
        <div>
          <div class="view-kicker">03 / Revenue overview</div>
          <h2>Know what's at stake.</h2>
          <div class="view-subtitle">An estimate based on bookings still awaiting a new session.</div>
        </div>
      </div>
      <div class="money-hero">
        <div class="small-label">Estimated money at risk</div>
        <div class="money-amount">${euro(people * PRICE)}</div>
        <div class="money-description">
          ${people} ${people === 1 ? "person" : "people"} waiting × €45 per person
        </div>
      </div>
      <div class="money-rows">
        <div class="money-row"><span>Bookings awaiting rebooking</span><strong>${bookings.length}</strong></div>
        <div class="money-row"><span>People awaiting rebooking</span><strong>${people}</strong></div>
        <div class="money-row"><span>Groups overdue by 48+ hours</span><strong>${late}</strong></div>
        <div class="money-row"><span>Currently booked groups</span><strong>${booked.length}</strong></div>
        <div class="money-row"><span>People currently booked</span><strong>${bookedCount}</strong></div>
      </div>
      <div class="notice">
        <strong>THE CALCULATION</strong><br>
        Money at risk = people awaiting rebooking × €45.
        Rebooking a whole group removes those people from the at-risk total.
        This is an illustrative estimate using fictional sample data, not actual revenue.
      </div>
      <div class="actions">
        <button class="btn btn-secondary" data-reset>↻ RESET SAMPLE DATA</button>
        <button class="btn btn-primary" data-go="today">BACK TO TODAY ↗</button>
      </div>
    `;
  }

  function render() {
    renderHeader();
    renderNav();

    if (view === "today") renderToday();
    else if (view === "rebook") renderRebook();
    else renderMoney();
  }

  function cancelSession(id) {
    const session = getSession(id);

    if (!session || session.cancelled) {
      toast("This session is already cancelled.");
      return;
    }

    const affected = bookedGroups(id);
    if (!affected.length) {
      toast("There are no bookings in this session to move.");
      return;
    }

    const people = affected.reduce((sum, b) => sum + b.groupSize, 0);
    const confirmed = window.confirm(
      `Cancel the ${time(session)} session on ${formatDate(session.date)}?\n\n` +
      `${affected.length} booking groups covering ${people} people will move to REBOOK.\n\n` +
      `Continue?`
    );

    if (!confirmed) return;

    const timestamp = new Date().toISOString();
    affected.forEach(booking => {
      booking.originalSession = sessionLabel(session);
      booking.cancelledAt = timestamp;
      booking.sessionId = null;
      booking.status = "pending";
    });

    session.cancelled = true;
    save();
    render();
    toast(`${affected.length} booking groups moved to REBOOK.`);
  }

  function rebookCustomer(id) {
    const booking = state.bookings.find(b => b.id === id);

    if (!booking || booking.status !== "pending") {
      toast("This booking is no longer awaiting rebooking.");
      render();
      return;
    }

    const picker = app.querySelector(`[data-picker="${id}"]`);
    const session = picker ? getSession(picker.value) : null;

    // Validate again at the moment of booking. Never rely only on
    // the session options rendered earlier.
    if (!session || session.cancelled ||
        session.date < dayKey() ||
        placesLeft(session) < booking.groupSize) {
      toast("Not enough places available. Please choose another session.");
      render();
      return;
    }

    const start = new Date(
      `${session.date}T${pad(session.hour)}:${pad(session.minute)}:00`
    );

    if (start <= new Date()) {
      toast("This session has already started. Choose a future session.");
      render();
      return;
    }

    booking.sessionId = session.id;
    booking.status = "booked";
    booking.cancelledAt = null;

    save();
    render();
    toast(`Rebooked ${booking.groupSize} people for ${sessionLabel(session)}.`);
  }

  function resetData() {
    if (!window.confirm(
      "Reset all changes and restore the original fictional sample data?\n\n" +
      "Your current browser demo changes will be replaced."
    )) return;

    state = makeInitialState();
    save();
    view = "today";
    render();
    toast("Sample data restored.");
  }

  document.querySelector(".nav").addEventListener("click", event => {
    const button = event.target.closest("[data-view]");
    if (!button) return;
    view = button.dataset.view;
    render();
    window.scrollTo({ top: 0, behavior: "auto" });
  });

  app.addEventListener("click", event => {
    const cancelButton = event.target.closest("[data-cancel]");
    if (cancelButton) {
      cancelSession(cancelButton.dataset.cancel);
      return;
    }

    const rebookButton = event.target.closest("[data-rebook]");
    if (rebookButton) {
      rebookCustomer(rebookButton.dataset.rebook);
      return;
    }

    const resetButton = event.target.closest("[data-reset]");
    if (resetButton) {
      resetData();
      return;
    }

    const goButton = event.target.closest("[data-go]");
    if (goButton) {
      view = goButton.dataset.go;
      render();
      window.scrollTo({ top: 0, behavior: "auto" });
    }
  });

  state = load();
  render();

  // Refresh overdue labels and dates if the page stays open.
  window.setInterval(() => {
    if (view === "rebook" || view === "money") render();
    else renderHeader();
  }, 60 * 1000);
})();
</script>
</body>
</html>
